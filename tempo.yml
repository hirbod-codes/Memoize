server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3.0 removed the ingester component entirely. In monolithic mode
# (target: all, the default — what this single-container deploy uses), the
# write path runs in-process via a block-builder + live-store instead, with
# no separate config block needed. (Previously this was a top-level
# `ingester:` block — just delete it, don't replace it with anything.)

# Tempo 3.0 renamed `compactor.compaction.*` -> `compaction.*` (dropped the
# duplicated "compaction" nesting) and moved compaction/retention duties to
# an in-process backend scheduler + worker in monolithic mode. Same value,
# new key path.
compaction:
  block_retention: 336h # 14 days — match Loki's retention_period above

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Derives request/error/duration metrics and a service graph directly from
# spans, remote-written into Prometheus. Requires Prometheus to be started
# with --web.enable-remote-write-receiver (see compose.swarm.yml).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
# ${MONGODB_PASSWORD}
# ${MEILISEARCH_KEY}
# ${MEILISEARCH_HOST}
# ${STREAM_SIGNING_SECRET}
# ${ACCESS_TOKEN_SECRET}
# ${REFRESH_TOKEN_SECRET}
# ${BUCKET_NAME}
# ${S3_STORAGE_ENDPOINT}
# ${S3_STORAGE_ACCESS_KEY}
# ${S3_STORAGE_SECRET_KEY}
# ${S3_API_KEY}

# ${ME_CONFIG_MONGODB_ADMINUSERNAME}
# ${ME_CONFIG_MONGODB_ADMINPASSWORD}
# ${ME_CONFIG_MONGODB_SERVER}

# ${MONGO_INITDB_ROOT_USERNAME}
# ${MONGO_INITDB_ROOT_PASSWORD}

# ${MEILI_MASTER_KEY}
# ${MEILI_NO_ANALYTICS}

# ${MONGO_EXPRESS_PORT}
# ${NGINX_PORT}
# ${MONGO_PORT}
# ${MEILISEARCH_PORT}
# ${GRAFANA_PORT}
# ${MEMOIZE_NGINX_VERSION}
# ${MEMOIZE_BACKEND_VERSION}

# ${GF_SECURITY_ADMIN_PASSWORD}

services:
  nginx:
    image: ghcr.io/hirbod-codes/memoize/nginx:${MEMOIZE_NGINX_VERSION}
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:443"
      - "443:443"
    networks:
      - backend_net

  memoize:
    image: ghcr.io/hirbod-codes/memoize/backend:${MEMOIZE_BACKEND_VERSION}
    container_name: memoize
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      HOST: 0.0.0.0
      PORT: 3000
      ALLOWED_ORIGINS: https://domain.tld
      DB_DATABASE_NAME: Memoize
      DB_SUPPORTS_TRANSACTION: false
      DB_URL: mongodb://mongo:27017
      TTS_API_KEY: ${TTS_API_KEY}
      MONGODB_USERNAME: ${MONGODB_USERNAME}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD}
      MEILISEARCH_KEY: ${MEILISEARCH_KEY}
      MEILISEARCH_HOST: ${MEILISEARCH_HOST}
      MEILISEARCH_PORT: 7700
      STREAM_SIGNING_SECRET: ${STREAM_SIGNING_SECRET}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      BUCKET_NAME: ${BUCKET_NAME}
      S3_STORAGE_ENDPOINT: ${S3_STORAGE_ENDPOINT}
      S3_STORAGE_ACCESS_KEY: ${S3_STORAGE_ACCESS_KEY}
      S3_STORAGE_SECRET_KEY: ${S3_STORAGE_SECRET_KEY}
      S3_API_KEY: ${S3_API_KEY}
    volumes:
      - ./memoize_logs:/app/logs:rw
    networks:
      - db_net
      - backend_net

  mongo:
    image: mongo:8.2.7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongo_data:/data/db
    networks:
      - db_net

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
    networks:
      - db_net

  meilisearch:
    image: getmeili/meilisearch:v1
    container_name: meilisearch
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_PORT}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: true
    volumes:
      - ./meili_data:/meili_data
    networks:
      - db_net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    # ports:
    #   - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    networks:
      - observability
      - backend_net

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:r
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/config.yml"
    # ports:
    #   - "3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - ./loki_data:/loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/config.yml"
    # ports:
    #   - "3200:3200"   # Tempo HTTP
    #   - "4317:4317"   # OTLP gRPC
    #   - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      - ./tempo_data:/var/tempo
    networks:
      - observability

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./alloy_data:/var/lib/alloy/data

      - ./alloy.config:/etc/alloy/config.alloy:ro

      # Docker discovery
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Container log files
      # - /var/lib/docker/containers:/var/lib/docker/containers:ro

      - ./memoize_logs:/var/log/memoize:ro

      # Host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability
      - backend_net

  cadvisor:
    image: bitnamicharts/cadvisor:0.1.13
    container_name: cadvisor
    restart: unless-stopped
    # ports:
    #   - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - observability

networks:
  observability:
    driver: bridge
  backend_net:
  db_net:

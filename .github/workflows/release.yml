  client-release:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Semantic Release (client)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: |
          cd client
          flutter pub get

      - run: |
          cd client
          flutter build apk --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod
          flutter build appbundle --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Rename app release
        run: |
          mkdir artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/memoize-app-release-${VERSION}.apk
          cp build/app/outputs/flutter-apk/app-release.aab artifacts/memoize-app-release-${VERSION}.aab

      - name: Upload android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*

  windows-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: |
          cd client
          flutter pub get

      - run: |
          cd client
          flutter build windows --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package Windows
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath memoize-windows-${VERSION}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: memoize-windows-${VERSION}.zip

  linux-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: |
          cd client
          flutter pub get

      - run: |
          cd client
          flutter build linux --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package Linux
        run: |
          tar -czf memoize-linux-${VERSION}.tar.gz -C build/linux/x64/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: memoize-linux-${VERSION}.tar.gz

  web-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: |
          cd client
          flutter pub get

      - run: |
          cd client
          flutter build web --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package Web
        run: |
          zip -r memoize-web-${VERSION}.zip build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: memoize-web-${VERSION}.zip

  macos-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: |
          cd client
          flutter pub get

      - run: |
          cd client
          flutter build macos --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package macOS
        run: |
          ditto -c -k build/macos/Build/Products/Release/Memoize.app memoize-macos-${VERSION}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: memoize-macos-${VERSION}.zip

  ios-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - name: Update version
        run: |
          sed -i "s/^version:.*/version: ${VERSION}+${{ github.run_number }}/" pubspec.yaml

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: |
          cd client
          flutter pub get

      - run: |
          cd client
          flutter build ios --release --no-codesign --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package iOS
        run: |
          cd build/ios
          zip -r ../../memoize-ios-${VERSION}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: memoize-ios-${VERSION}.zip

  create-release:
    runs-on: ubuntu-latest
    needs:
      - backend-release
      - frontend-release
      - client-release
      - android-build
      - windows-build
      - linux-build
      - web-build
      - macos-build
      - ios-build
    if: |
      always() &&
      (
        needs.backend-release.outputs.released == 'true' ||
        needs.frontend-release.outputs.released == 'true' ||
        needs.client-release.outputs.released == 'true'
      ) &&
      needs.android-build.result != 'failure' &&
      needs.windows-build.result != 'failure' &&
      needs.linux-build.result != 'failure' &&
      needs.web-build.result != 'failure' &&
      needs.macos-build.result != 'failure' &&
      needs.ios-build.result != 'failure'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-nginx-repo:
    needs:
      - create-release
      - detect-changes
      - frontend-release
    runs-on: ubuntu-latest
    if: needs.frontend-release.result == 'success' && needs.frontend-release.outputs.version != '' && needs.create-release.result == 'success'

    steps:
      - name: Send dispatch to Nginx repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: hirbod-codes/nginx
          event-type: memoize-released
          client-payload: |
            {
            "VERSION": "${{ needs.frontend-release.outputs.version }}"
            }

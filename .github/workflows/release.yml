name: hirbod-codes/Memoize/Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect folder changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            client:
              - 'client/**'

  backend-release:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Semantic Release (backend)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-release
    if: needs.backend-release.result == 'success' && needs.backend-release.outputs.released == 'true' && needs.backend-release.outputs.version != ''

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Build Docker image
        run: |
          cd backend
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t ghcr.io/hirbod-codes/memoize/backend:${{ needs.backend-release.outputs.version }} --target production .
          docker push ghcr.io/hirbod-codes/memoize/backend:${{ needs.backend-release.outputs.version }}
          docker save ghcr.io/hirbod-codes/memoize/backend:${{ needs.backend-release.outputs.version }} | gzip > backend-image-${{ needs.backend-release.outputs.version }}.tar.gz

      - name: Create latest copies
        run: |
          cp backend-image-${{ needs.backend-release.outputs.version }}.tar.gz backend-image-latest.tar.gz

      - name: Upload latest backend build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds backend-image-latest.tar.gz --clobber

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image-${{ needs.backend-release.outputs.version }}.tar.gz

  client-release:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client == 'true'
    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Semantic Release (client)
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: client
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.client-release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        working-directory: client
        run: dart run update_flutter_version.dart

      - name: Install flutter project dependencies
        run: |
          cd client
          flutter pub get

      - name: Build android app
        run: |
          cd client
          flutter build apk --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod
          flutter build appbundle --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Rename app release
        run: |
          mkdir artifacts
          cp client/build/app/outputs/flutter-apk/app-release.apk artifacts/memoize-app-release-${{ needs.client-release.outputs.version }}.apk
          cp client/build/app/outputs/bundle/release/app-release.aab artifacts/memoize-app-release-${{ needs.client-release.outputs.version }}.aab

      - name: Create latest copies
        run: |
          mkdir -p latest_artifacts
          cp artifacts/memoize-app-release-${{ needs.client-release.outputs.version }}.apk latest_artifacts/memoize-app-release-latest.apk
          cp artifacts/memoize-app-release-${{ needs.client-release.outputs.version }}.aab latest_artifacts/memoize-app-release-latest.aab

      - name: Upload latest android builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds latest_artifacts/memoize-app-release-latest.apk latest_artifacts/memoize-app-release-latest.aab --clobber

      - name: Upload android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*

  windows-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: windows-latest

    env:
      VERSION: ${{ needs.client-release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        working-directory: client
        run: dart run update_flutter_version.dart

      - name: Install flutter project dependencies
        run: |
          cd client
          flutter pub get

      - name: Build windows app
        run: |
          cd client
          flutter build windows --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package Windows
        run: |
          Compress-Archive -Path client/build/windows/x64/runner/Release/* -DestinationPath memoize-windows-${{ needs.client-release.outputs.version }}.zip

      - name: Create latest copies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force latest_artifacts
          Copy-Item "memoize-windows-${{ needs.client-release.outputs.version }}.zip" "latest_artifacts/memoize-windows-latest.zip"

      - name: Upload latest windows build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds latest_artifacts/memoize-windows-latest.zip --clobber

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: memoize-windows-${{ needs.client-release.outputs.version }}.zip

  linux-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.client-release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        working-directory: client
        run: dart run update_flutter_version.dart

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libasound2-dev libmpv-dev mpv

      - name: Install flutter project dependencies
        run: |
          cd client
          flutter pub get

      - name: Build linux app
        run: |
          cd client
          flutter build linux --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package Linux
        run: |
          tar -czf memoize-linux-${{ needs.client-release.outputs.version }}.tar.gz -C client/build/linux/x64/release/bundle .

      - name: Create latest copies
        run: |
          mkdir -p latest_artifacts
          cp memoize-linux-${{ needs.client-release.outputs.version }}.tar.gz latest_artifacts/memoize-linux-latest.tar.gz

      - name: Upload latest linux build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds latest_artifacts/memoize-linux-latest.tar.gz --clobber

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: memoize-linux-${{ needs.client-release.outputs.version }}.tar.gz

  web-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ needs.client-release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        working-directory: client
        run: dart run update_flutter_version.dart

      - name: Install flutter project dependencies
        run: |
          cd client
          flutter pub get

      - name: Build web app
        run: |
          cd client
          flutter build web --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package web
        run: |
          zip -r memoize-web-${{ needs.client-release.outputs.version }}.zip client/build/web

      - name: Create latest copies
        run: |
          mkdir -p latest_artifacts
          cp memoize-web-${{ needs.client-release.outputs.version }}.zip latest_artifacts/memoize-web-latest.zip

      - name: Upload latest web build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds latest_artifacts/memoize-web-latest.zip --clobber

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            memoize-web-latest.zip
            memoize-web-${{ needs.client-release.outputs.version }}.zip

  macos-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: macos-latest

    env:
      VERSION: ${{ needs.client-release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        working-directory: client
        run: dart run update_flutter_version.dart

      - name: Install flutter project dependencies
        run: |
          cd client
          flutter pub get

      - name: Build macOS app
        run: |
          cd client
          flutter build macos --release --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Package macOS
        run: |
          APP=$(find client/build/macos/Build/Products/Release -name "*.app" | head -1)
          echo "Found app: $APP"
          ditto -c -k "$APP" "memoize-macos-${{ needs.client-release.outputs.version }}.zip"

      - name: Create latest copies
        run: |
          mkdir -p latest_artifacts
          cp memoize-macos-${{ needs.client-release.outputs.version }}.zip latest_artifacts/memoize-macos-latest.zip

      - name: Upload latest macOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds latest_artifacts/memoize-macos-latest.zip --clobber

      - name: Upoad macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: memoize-macos-${{ needs.client-release.outputs.version }}.zip

  ios-build:
    needs: client-release
    if: needs.client-release.result == 'success' && needs.client-release.outputs.released == 'true' && needs.client-release.outputs.version != ''
    runs-on: macos-latest

    env:
      VERSION: ${{ needs.client-release.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set Version
        run: |
          echo "VERSION=${{ needs.client-release.outputs.version }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Update version
        working-directory: client
        run: dart run update_flutter_version.dart

      - name: Install flutter project dependencies
        run: |
          cd client
          flutter pub get

      - name: Build ios app
        run: |
          cd client
          flutter build ios --release --no-codesign --dart-define=API_URL=https://memoize.hirbod-codes.ir:1404 --dart-define=ENV=prod

      - name: Create the unsigned ipa
        run: |
          mkdir Payload
          mv client/build/ios/iphoneos/Runner.app/ Payload
          zip -qq -r -9 memoize-ios-${{ needs.client-release.outputs.version }}.ipa Payload

      - name: Create latest copies
        run: |
          mkdir -p latest_artifacts
          cp memoize-ios-${{ needs.client-release.outputs.version }}.ipa latest_artifacts/memoize-ios-latest.ipa

      - name: Upload latest iOS build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload latest-builds latest_artifacts/memoize-ios-latest.ipa --clobber

      - name: Upload ios artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: memoize-ios-${{ needs.client-release.outputs.version }}.ipa

  create-release:
    runs-on: ubuntu-latest
    needs:
      - backend-release
      - client-release
      - android-build
      - windows-build
      - linux-build
      - web-build
      - macos-build
      - ios-build
    if: |
      always() &&
      (
        needs.backend-release.outputs.released == 'true' ||
        needs.client-release.outputs.released == 'true'
      ) &&
      needs.android-build.result != 'failure' &&
      needs.windows-build.result != 'failure' &&
      needs.linux-build.result != 'failure' &&
      needs.web-build.result != 'failure' &&
      needs.macos-build.result != 'failure' &&
      needs.ios-build.result != 'failure'

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-nginx-repo:
    needs:
      - create-release
      - detect-changes
      - client-release
    runs-on: ubuntu-latest
    if: needs.client-release.result == 'success' && needs.client-release.outputs.version != '' && needs.create-release.result == 'success'

    steps:
      - name: Send dispatch to Nginx repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: hirbod-codes/nginx
          event-type: memoize-released
          client-payload: |
            {
            "VERSION": "${{ needs.frontend-release.outputs.version }}"
            }

name: hirbod-codes/Memoize/Release

on:
  push:
    branches:
        - main

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 22

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
            working_directory: frontend
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if no release
        if: steps.semantic.outputs.new_release_published != 'true'
        run: exit 0

      - name: Set Version
        run: |
            echo "VERSION=${{ steps.semantic.outputs.new_release_version }}" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
            node-version: 22

      - name: Install dependencies
        run: |
            cd frontend
            npm ci

      - name: Build Vite app
        run: |
            cd frontend
            npm run build

      - name: Verify dist exists
        run: |
            cd frontend
            ls -la dist

      - name: Package dist folder
        run: |
            cd frontend
            tar -czf dist.tar.gz dist

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend's Docker Image
        run: |
            cd backend
            docker build -t ghcr.io/${{ github.repository }}/backend:${VERSION} -t ghcr.io/${{ github.repository }}/backend:latest --target production .

      - name: Push Docker Image
        run: |
            docker push ghcr.io/${{ github.repository }}/backend:${VERSION}
            docker push ghcr.io/${{ github.repository }}/backend:latest

      - name: Export Docker Image
        run: |
            docker save ghcr.io/${{ github.repository }}:${VERSION} | gzip > image-${VERSION}.tar.gz

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
            tag_name: v${{ env.VERSION }}
            files: |
                image-${{ env.VERSION }}.tar.gz
                dist.tar.gz
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send dispatch to Nginx repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: hirbod-codes/nginx
          event-type: memoize-released
          client-payload: |
            {
              "version": "${{ github.ref_name }}"
            }

# TEMPORARY SECURITY NOTE: every port below is published on 0.0.0.0 with
# zero auth, per your call to defer security for now. Loki/Tempo/Pushgateway
# will accept writes from ANYONE who finds the IP:port, and Grafana's login
# is whatever GF_SECURITY_ADMIN_PASSWORD is set to below. Fine for a
# short-lived dev sandbox; firewall this to your home IP (or move it onto
# your sing-box VPN) before it sits around for more than a few days.

services:
  loki:
    container_name: loki
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/config.yml"
    ports:
      - "1407:3100" # pino-loki pushes here from local dev
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - ./loki_data:/loki
    networks:
      - dev_observability

  tempo:
    container_name: tempo
    image: grafana/tempo:3.0.2
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/config.yml"
    ports:
      - "1408:4317" # OTLP gRPC — traceExporter in tracing.ts can use this
      - "1409:4318" # OTLP HTTP  — or this, matching OTLPTraceExporter's http default
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      - ./tempo_data:/var/tempo
    networks:
      - dev_observability

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "1410:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    networks:
      - dev_observability

  pushgateway:
    container_name: pushgateway
    image: prom/pushgateway:v1.11.1
    restart: unless-stopped
    ports:
      - "1411:9091"
    networks:
      - dev_observability

  grafana:
    container_name: grafana
    image: grafana/grafana:13.0
    restart: unless-stopped
    ports:
      - "1412:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dev_observability

networks:
  dev_observability:
    driver: bridge
